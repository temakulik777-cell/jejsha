name: Build APK from 1616.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 1616.zip
      run: |
        unzip 1616.zip -d project_files
        echo "=== Ищем корень Android-проекта ==="
        # Ищем settings.gradle только в корне internal-main или в internal-main/android
        find project_files/internal-main -maxdepth 2 -name "settings.gradle"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # Проверяем два самых вероятных пути
        if [ -f "project_files/internal-main/settings.gradle" ]; then
          cd project_files/internal-main
        elif [ -f "project_files/internal-main/android/settings.gradle" ]; then
          cd project_files/internal-main/android
        else
          echo "Ошибка: Не нашли settings.gradle в internal-main или internal-main/android!"
          # Выведем список всех найденных для отладки
          find project_files -name "settings.gradle" | head -n 5
          exit 1
        fi
        
        echo "Сборка в папке: $(pwd)"
        gradle assembleDebug --no-daemon
