name: Build APK from 1616.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 1616.zip
      run: |
        unzip 1616.zip -d project_files
        echo "=== Ищем файлы сборки ==="
        find project_files -name "settings.gradle" -o -name "build.gradle" | head -n 10

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # Ищем settings.gradle (это самый надежный маркер корня проекта)
        SETTINGS_PATH=$(find project_files -name "settings.gradle" | head -n 1)
        
        if [ -n "$SETTINGS_PATH" ]; then
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_DIR"
          echo "Нашли settings.gradle. Сборка в папке: $(pwd)"
          gradle assembleDebug --no-daemon
        else
          # Если settings.gradle нет, ищем build.gradle
          BUILD_PATH=$(find project_files -name "build.gradle" | head -n 1)
          if [ -n "$BUILD_PATH" ]; then
            PROJECT_DIR=$(dirname "$BUILD_PATH")
            cd "$PROJECT_DIR"
            echo "Нашли build.gradle. Сборка в папке: $(pwd)"
            gradle assembleDebug --no-daemon
          else
            echo "Ошибка: Не найдены файлы сборки Gradle!"
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-APK
        path: "**/build/outputs/apk/debug/*.apk"
