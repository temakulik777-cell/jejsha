name: Build APK from 1616.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 1616.zip
      run: |
        unzip 1616.zip -d project_files

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # Ищем ИМЕННО файл gradlew, чтобы найти настоящий корень проекта
        GRADLEW_PATH=$(find project_files -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Ошибка: Файл gradlew не найден! Возможно, это не стандартный Android-проект."
          exit 1
        fi
        
        # Переходим в папку, где лежит gradlew
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        echo "Сборка в папке: $(pwd)"
        
        # Даем права на запуск
        chmod +x gradlew
        
        # Собираем Debug APK
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-APK
        # Ищем APK файл во всех папках сборки
        path: "**/build/outputs/apk/debug/*.apk"
