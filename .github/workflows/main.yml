name: Build APK from 1616.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 1616.zip
      run: |
        unzip 1616.zip -d project_files
        echo "=== Содержимое корня ==="
        ls -la project_files

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Пропускаем установку SDK, так как он уже есть на сервере
    # Просто указываем переменную окружения для Gradle
    - name: Build APK with Gradle
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
      run: |
        # Ищем папку с проектом
        if [ -f "project_files/gradlew" ]; then
          cd project_files
        elif [ -d "project_files/1616" ]; then
          cd project_files/1616
        else
          SETTINGS_DIR=$(find project_files -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -n "$SETTINGS_DIR" ]; then
            cd "$SETTINGS_DIR"
          else
            echo "Ошибка: Не найдены файлы Gradle (settings.gradle)!"
            exit 1
          fi
        fi
        
        echo "Сборка в папке: $(pwd)"
        
        # Даем права на запуск
        chmod +x gradlew || true
        
        # Собираем Debug APK
        # Флаг --no-daemon нужен, чтобы Gradle не висел в памяти после сборки
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-APK
        path: "**/build/outputs/apk/debug/*.apk"
